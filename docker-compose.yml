services:
  redis:
    image: redis:7
    ports: ["6379:6379"]
    volumes: [redis_data:/data]

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]

  neo4j:
    image: neo4j:5
    ports: ["7474:7474", "7687:7687"] # 7474 = navegador web, 7687 = Bolt (driver)
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes: [neo4j_data:/data]

  cassandra:
    image: cassandra:4.1
    ports: ["9042:9042"]
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    volumes: [cassandra_data:/var/lib/cassandra]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s # Cassandra tarda en arrancar

volumes:
  redis_data:
  mongo_data:
  neo4j_data:
  cassandra_data:
